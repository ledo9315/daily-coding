services:
  # Eigener Piston (opensource). Nach Start: pnpm piston:install (HTTP /api/v2/packages).
  piston:
    image: ghcr.io/engineer-man/piston
    # Image nur amd64; auf Apple Silicon (arm64) erzwingt das QEMU/Rosetta-Emulation.
    platform: linux/amd64
    container_name: daily-dev-piston
    restart: unless-stopped
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec

  db:
    # Hauptversion folgt der Produktionsdatenbank (Neon, aktuell 17). Weicht sie ab,
    # kann pg_dump aus diesem Container nicht mehr gegen die Produktion arbeiten.
    image: postgres:17-alpine
    container_name: daily-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: daily_dev
      POSTGRES_USER: daily_dev
      POSTGRES_PASSWORD: daily_dev_secret
    ports:
      - "5433:5432"
    volumes:
      - daily_dev_pgdata:/var/lib/postgresql/data

volumes:
  daily_dev_pgdata:
  piston_packages:
