services:
  # Self-hosted Piston (open source). Once running: pnpm piston:install (HTTP /api/v2/packages).
  piston:
    image: ghcr.io/engineer-man/piston
    # The image is amd64 only; on Apple Silicon (arm64) this forces QEMU/Rosetta emulation.
    platform: linux/amd64
    container_name: daily-dev-piston
    restart: unless-stopped
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec

  db:
    # The major version tracks the production database (Neon, currently 17). If they
    # diverge, pg_dump from this container can no longer run against production.
    image: postgres:17-alpine
    container_name: daily-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: daily_dev
      POSTGRES_USER: daily_dev
      POSTGRES_PASSWORD: daily_dev_secret
    ports:
      - "5433:5432"
    volumes:
      - daily_dev_pgdata:/var/lib/postgresql/data

volumes:
  daily_dev_pgdata:
  piston_packages:
