services:
  # Self-hosted Piston (open source). Once running: pnpm piston:install (HTTP /api/v2/packages).
  piston:
    image: ghcr.io/engineer-man/piston
    # The image is amd64 only; on Apple Silicon (arm64) this forces QEMU/Rosetta emulation.
    platform: linux/amd64
    container_name: daily-dev-piston
    restart: unless-stopped
    privileged: true
    environment:
      # Piston's default ceiling is 3000 ms of CPU per run. Compilation happens inside the run
      # step, and javac plus JVM startup alone burn 2500-3100 ms, the Go toolchain about 1700 -
      # submissions were killed with SIGKILL and an empty output at random. These two values are
      # the *upper bound* a request may ask for, not the default every program gets:
      # piston-runner.ts asks for the full budget only for Java and Go, the interpreted
      # languages send no limit at all.
      PISTON_RUN_TIMEOUT: "15000"
      PISTON_RUN_CPU_TIME: "15000"
      # Go's runtime starts a thread per core and aborts under Piston's default cap of 64
      # processes - every successful Go program died with "Sandbox keeper received fatal
      # signal 6" while compile errors came back normally, which is a confusing way to learn it.
      PISTON_MAX_PROCESS_COUNT: "256"
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec

  db:
    # The major version tracks the production database (Neon, currently 17). If they
    # diverge, pg_dump from this container can no longer run against production.
    image: postgres:17-alpine
    container_name: daily-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: daily_dev
      POSTGRES_USER: daily_dev
      POSTGRES_PASSWORD: daily_dev_secret
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - daily_dev_pgdata:/var/lib/postgresql/data

volumes:
  daily_dev_pgdata:
  piston_packages:
