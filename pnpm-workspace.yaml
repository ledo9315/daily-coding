# Since pnpm 11, unapproved build scripts are an error, and pnpm no longer reads
# settings from the "pnpm" field in package.json. Without an entry here even
# `pnpm exec` aborts, because it runs a dependency check first.
#
# All of them fetch or link platform-specific binaries:
#   prisma / @prisma/engines  engine binaries (schema-engine) for prisma migrate
#   esbuild                   transpiler binary, used by Vite/Vitest
#   sharp                     libvips for Next.js image optimisation
#   unrs-resolver             napi resolver, used by ESLint
#   @swc/core                 next-intl's message extractor
#   @parcel/watcher           next-intl's dev-time message reload
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  dompurify: 3.4.12
  fast-uri: 3.1.4
  lodash: 4.18.1
  postcss: 8.5.25
  sharp: 0.35.0
